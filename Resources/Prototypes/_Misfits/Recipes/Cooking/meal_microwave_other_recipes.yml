## CANDIES!!!
#Carrot Candy: 5u Sugar, 5u Carrot Juice, must be heated

- type: entity
  parent: MisfitsFoodBase
  description:
  name: !type:CreateVariants
    values: [ Carrot Candy, Buffalo Gourd Candy, Blackberry Candy, Butterscotch Candy, Jet Jawbreaker ]
  id: !type:CreateVariants
    values: [ MisfitsFoodCarrotCandy, MisfitsFoodBuffaloGourdCandy, MisfitsFoodBlackberryCandy, MisfitsFoodButterscotchCandy, MisfitsFoodJetCandy ]
  components:
  - type: Sprite
    sprite: Corvax/Objects/Consumable/Food/fish_pie.rsi
    state: fish-slice
  - type: Food
  - type: Tag
    tags:
    - Candy
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: !type:CreateVariants
            values: [ PickledCarrots, BuffaloGourdJam, BlackberryJam, Butterscotch, Jet ]
          Quantity: 5
        - ReagentId: Sugar
          Quantity: !type:CreateVariants
            values: [ 5, 5, 5, 5, 10 ]

- type: reaction
  id: CarrotCandy
  impact: Low
  quantized: true
  minTemp: 400
  reactants:
    JuiceCarrot:
      amount: 5
    Sugar:
      amount: 5
  effects:
  - !type:CreateEntityReactionEffect
    entity: MisfitsFoodCarrotCandy
#Buffalo Gourd: 5u sugar, 5u Buffalo Gourd Juice, must be heated
- type: reaction
  id: BuffaloGourdCandy
  impact: Low
  quantized: true
  minTemp: 400
  reactants:
    ExtractBuffaloGourd:
      amount: 5
    Sugar:
      amount: 5
  effects:
  - !type:CreateEntityReactionEffect
    entity: MisfitsFoodBuffaloGourdCandy
#Blackberry: 5u sugar, 5u Blackberry juice, must be heated
- type: reaction
  id: BlackberryCandy
  impact: Low
  quantized: true
  minTemp: 400
  reactants:
    ExtractBlackberries:
      amount: 5
    Sugar:
      amount: 5
  effects:
  - !type:CreateEntityReactionEffect
    entity: MisfitsFoodBlackberryCandy
#Butterscotch: 5u sugar, 5u butter, must be heated
- type: reaction
  id: ButterscotchCandy
  impact: Low
  quantized: true
  minTemp: 400
  reactants:
    Butter:
      amount: 5
    Sugar:
      amount: 5
  effects:
  - !type:CreateEntityReactionEffect
    entity: MisfitsFoodButterscotchCandy
#Jet Jawbreaker: 10u sugar, 5u jet, must be heated
- type: reaction
