# sausage/cooked
- type: entity
  parent: MisfitsFoodBase
  description: food-desc-sausage
  name: Sausage
  id: !type:CreateVariants
    values: [ MisfitsFoodSausage, MisfitsFoodSausageCooked]
  components:
  - type: Food
    eatMessage: food-desc-sausageCooked-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: !type:CreateVariants
    values: [ sausage, sausageFried]
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: !type:CreateVariants
            values: [ N14UncookedAnimalProteinsRad, Protein ]
          Quantity: 4
        - ReagentId: !type:CreateVariants
            values: [ Fat, Nutriment ]
          Quantity: 2
  - type: GeneralConstructs
    generalEnts:
      Cooked: !type:CreateVariants
        values: [ MisfitsFoodSausageCooked, MisfitsFoodSausageCooked]
  - type: Construction
    graph: GraphCookAny
    node: !type:CreateVariants
      values: [ start, CookNode]
    defaultTarget: !type:CreateVariants
      values: [ CookNode, start]

- type: microwaveMealRecipe
  id: MisfitsRecipeSausageChain
  name: Sausage Chain
  result: MisfitsFoodSausageChain
  time: 5
  reagents:
    N14UncookedAnimalProteinsRad: 20
  solids:
    OrganAnimalRuminantStomach: 1


