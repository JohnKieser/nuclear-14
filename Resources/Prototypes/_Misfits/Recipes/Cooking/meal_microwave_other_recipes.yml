# diced stuff
- type: entity
  parent: MisfitsFoodBase
  description:
  name: !type:CreateVariants
    values: [ Diced Meat, Diced Tato, Diced Garlic, Diced Onion]
  id: !type:CreateVariants
    values: [ MisfitsFoodDicedMeat, MisfitsFoodDicedTato, MisfitsFoodDicedGarlic, MisfitsFoodDicedOnion ]
  components:
  - type: Sprite
    sprite: Corvax/Objects/Consumable/Food/fish_pie.rsi
    state: fish-slice
  - type: SolutionSpiker
    sourceSolution: food
    ignoreEmpty: true
  - type: ScoopableSolution
    solution: food
  - type: Extractable
    grindableSolutionName: food
  - type: Food
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: !type:CreateVariants
            values: [ DicedMeat, DicedTato, DicedGarlic, DicedOnion ]
          Quantity: 10

#Diced Meat: Obtained via Cutting a Cutlet. Can be added to a container as a chem as 10u of it.
- type: reagent
  id: DicedMeat
  name: reagent-name-juice-carrot
  parent: BaseJuice
  desc: reagent-desc-juice-carrot
  physicalDesc: reagent-physical-desc-crisp
  group: Foods
  flavor: carrot
  color: "#FF8820"
  metabolisms:
    Drink:
      effects:
      - !type:AdjustReagent
        reagent: N14UncookedAnimalProteinsRad
        amount: 1


#Diced Tato: Obtained via Cutting a Tato. Can be added to a container as a chem as 10u of it.
