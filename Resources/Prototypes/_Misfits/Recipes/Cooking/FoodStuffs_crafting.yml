#- Waster Burrito (Crafting Menu): 1 Cooked Meat (any), 1 dough slice
- type: constructionGraph
  id: WasterBurritoGraph
  start: start
  graph:
  - node: start
    edges:
    - to: WasterBurrito
      steps:
      - allTags:
        - Meat
        - Cooked
        name: Any Cooked Meat
        icon:
          sprite: Objects/Consumable/Food/meat.rsi
          state: plain-cooked
      - entity: N14FoodDoughSlice
  - node: WasterBurrito
    entity: MisfitsFoodWasterBurrito

- type: construction
  id: CraftWasterBurrito
  graph: WasterBurritoGraph
  startNode: start
  targetNode: WasterBurrito
  icon: {sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi, state: wasterBurrito}
  category: construction-category-food
  objectType: Item
  canBuildInImpassable: true
  hide: false

- type: entity
  parent: MisfitsFoodBase
  description: food-desc-wasterBurrito
  name: Waster Burrito
  id: MisfitsFoodWasterBurrito
  components:
  - type: Food
    eatMessage: food-desc-wasterBurrito-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: wasterBurrito
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 15
        - ReagentId: Protein
          Quantity: 5
  - type: Construction
    graph: WasterBurritoGraph
    node: WasterBurrito

