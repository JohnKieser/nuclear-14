  name: Candy Pouch
  id: MisfitsClothingPouchCandy
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: candyPouch
  - type: Construction
    graph: CandyPouchGraph
    node: CandyPouch
  - type: Item
    size: Tiny
  - type: Storage
    grid:
    - 0,0,4,4
    whitelist:
      tags:
      - Candy

- type: constructionGraph
  id: CandyPouchGraph
  start: start
  graph:
  - node: start
    edges:
    - to: CandyPouch
      steps:
      - material: Thread
        amount: 1
      - material: Leather
        amount: 1
  - node: CandyPouch
