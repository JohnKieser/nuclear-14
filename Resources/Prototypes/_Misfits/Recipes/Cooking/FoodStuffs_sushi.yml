#  __RECIPIES__
#
#- Simple Sushi: 10u rice, 1 Cut Cutlet
#- Simple Fried Sushi: 10u rice, 1 Cooked Cut Cutlet -> 5 sec
#- Carrot and Fish Sushi Roll: 1 carrot, 10u rice, 1 cut cutlet -> 5 sec
#- Fish Sushi Roll: 1 cut cutlet, 10u rice -> 5 sec
#- Large Sushi Roll: 2 cut cutlets, 2 carrots, 20u rice -> 10 sec
#- New California Roll: 1 cut cutlet, 2 carrots, 10u rice -> 5 sec
#- Spicy Roll: 2u hot sauce, 2 bighorn cutlets, 10u rice, 1 cut cutlet -> 5 sec


#- NCR Patriotic Roll: 1 New California Roll, 1 cloth, 1 wood -> 5 sec
#- Legion Patriotic Roll: 1 Spicy Roll, 1 cloth, 1 wood -> 5 sec

#- Sushi with Cream Cheese: 5u Milk, 1 Cheese Wedge, 1 Cut Cutlet, 10u rice -> 5 sec
#- Cut Cutlet: Use knife on Red Fish Cut, gives 3 Cutlets
#
#- Rice Cake: 1 cooked rice, 5u salt -> 5 sec
#
#- Coxinha: 5u ground animal protein, 1 dough slice, 5u salt -> 5 sec
#
#
#- Meat Dumpling: 1 dough slice, 5u ground animal protein -> 5 sec
#
#- Khan Meat Dumpling: 1 dumpling, 5u jet, 1 leather, 1 wood -> 5 sec
#
#- Carrot Vitamin Gummy: 5u carrot juice, 5u sugar -> 5 sec
#
#- Milk Chocolate Bar: 2u cocoa powder, 5u milk, 5u sugar (must be in separate containers else create regular choc) -> 5 sec
#
#- VaultTech Lolipop: 10u sugar, 1 paper -> 5 sec
#
#- Spicy n Sweet Skewer: 2 jalapeno, 2 black berry, 1 skewer -> 5 sec
#
#- Waster Burrito (Crafting Menu): 1 Cooked Meat (any), 1 dough slice
#
#- Waster Burrito Supreme (Crafting Menu): 1 Cooked Meat (any), 1 Cabbage, 1 Cheese Wedge, 1 Tato
#
#- Kebab Pilar: 5 raw brahmin steaks, 1 wood -> 30 sec
#
#- Kebab Slice: Use knife on Kebab, gives 9 slices
#
#- Kebab Wrap: 3 Kebab Slices, 1 onion, 1 cabbage, 1 dough slice -> 5 sec
#
#- Permisson: 1 radstag cutlet, 2 pinion nuts, 2 blackberies -> 10 sec
#
#- Toffee -> 1 Pinion nut, 15u sugar -> 15 sec
#
#- Meat Jerky: 1 meat cutlet, 5u salt -> 15 sec
#
#- Cabbage n Meat Bread: 1 cabbage, 5u ground animal protein, 1 dough -> 10 sec
#
#- Thick Pancake: 10u flour, 5u milk, 5u egg, 5u Raiser -> 5 sec
#
#- Food Box: 5 planks
