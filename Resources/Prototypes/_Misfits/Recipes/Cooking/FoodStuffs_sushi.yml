





- type: entity
  parent: BaseItem
  id: MisfitsFoodBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
    - food
  - type: Food
  - type: Sprite
  - type: StaticPrice
    price: 0


# plain sushi unused
- type: entity
  parent: MisfitsFoodBase
  name: Plain Sushi
  id: MisfitsFoodSushiPlain
  components:
  - type: Food
    transferAmount: 10
  - type: Sprite
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 13
        reagents:
        - ReagentId: Rice
          Quantity: 10
  - type: Construction
    graph: CraftSushiBasicGraph
    node: start
    defaultTarget: SushiBasic

# Raw sushi

- type: entity
  parent: MisfitsFoodBase
  name: !type:CreateVariants
    values: [Simple Sushi, Fish Sushi, Carrot and Fish Sushi, New California Roll, Spicy Roll]
  id: !type:CreateVariants
    values: [ MisfitsFoodSushiMeatRaw, MisfitsFoodSushiFishRaw, MisfitsFoodSushiFishCarrotRaw ,MisfitsFoodSushiNCRRaw, MisfitsFoodSushiSpicyRaw]
  components:
  - type: Food
    transferAmount: 10
  - type: Sprite
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 35
        reagents:
        - ReagentId: Rice
          Quantity: 10
        - ReagentId: N14UncookedAnimalProteinsRad
          Quantity: !type:CreateVariants
            values: [3,3,3,3,9]
        - ReagentId: !type:CreateVariants
            values: [ Fat,Vitamin, Vitamin, Fat, Fat]
          Quantity: !type:CreateVariants
            values: [2,5,5,2,6]
        - ReagentId: !type:CreateVariants
            values: [Empty,Empty, JuiceCarrot, JuiceCarrot, Hotsauce]
          Quantity: !type:CreateVariants
            values: [1,1,10,20,2]
  - type: GeneralConstructs
    generalEnts:
      SushiFried: !type:CreateVariants
        values: [ MisfitsFoodSushiMeatCooked, MisfitsFoodSushiFishCooked, MisfitsFoodSushiFishCarrotCooked, MisfitsFoodSushiNCRCooked, MisfitsFoodSushiSpicyCooked]
  - type: Construction
    graph: GraphSushi
    node: start
    defaultTarget: SushiFried

# cream sushi

- type: entity
  parent: MisfitsFoodBase
  name: !type:CreateVariants
    values: [Cream Cheese Sushi, Fried Cream Cheese Sushi ]
  id: !type:CreateVariants
    values: [ MisfitsFoodSushiCheeseRaw,MisfitsFoodSushiCheeseCooked]
  components:
  - type: Food
    transferAmount: 10
  - type: Sprite
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 35
        reagents:
        - ReagentId: Rice
          Quantity: 10
        - ReagentId: !type:CreateVariants
            values: [ N14UncookedAnimalProteinsRad, Protein ]
          Quantity: !type:CreateVariants
            values: [3,2]
        - ReagentId: !type:CreateVariants
            values: [ Fat,Nutriment]
          Quantity: !type:CreateVariants
            values: [2,7]
        - ReagentId: !type:CreateVariants
            values: [Nutriment,Empty]
          Quantity: !type:CreateVariants
            values: [5,1]
        - ReagentId: Milk
          Quantity: 5
  - type: GeneralConstructs
    generalEnts:
      SushiFried: !type:CreateVariants
        values: [ MisfitsFoodSushiCheeseCooked, MisfitsFoodSushiCheeseCooked]
  - type: Construction
    graph: GraphSushi
    node: !type:CreateVariants
      values: [ start, SushiFried]
    defaultTarget: !type:CreateVariants
      values: [ SushiFried, start]


# Cooked Sushi

