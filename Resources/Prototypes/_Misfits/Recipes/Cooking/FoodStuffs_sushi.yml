# Large Sushi raw/cooked

- type: entity
  parent: MisfitsFoodBase
  name: !type:CreateVariants
    values: [Large Sushi, Large Fried Sushi ]
  id: !type:CreateVariants
    values: [ MisfitsFoodSushiMeatLargeRaw, MisfitsFoodSushiMeatLargeCooked ]
  components:
  - type: Food
    transferAmount: 10
  - type: Sprite
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 65
        reagents:
        - ReagentId: Rice
          Quantity: 20
        - ReagentId: !type:CreateVariants
            values: [ N14UncookedAnimalProteinsRad, Protein ]
          Quantity: !type:CreateVariants
            values: [3, 2]
        - ReagentId: !type:CreateVariants
            values: [ Fat, Nutriment]
          Quantity: !type:CreateVariants
            values: [ 2, 2]
        - ReagentId: JuiceCarrot
          Quantity: 20
  - type: Construction
    graph: GraphSushi
    node: !type:CreateVariants
      values: [ start, SushiFried]
    defaultTarget: !type:CreateVariants
      values: [ SushiFried, start]

# NCR/Legion Rolls raw/cooked
- type: entity
  parent: MisfitsFoodBase
  name: !type:CreateVariants
    values: [NCR Patriotic Roll, Fried NCR Patriotic Roll, Legion Patriotic Roll, Fried Legion Patriotic Roll]
  id: !type:CreateVariants
    values: [ MisfitsFoodSushiNCRSuperRaw, MisfitsFoodSushiNCRSuperCooked, MisfitsFoodSushiLegionSuperRaw ,MisfitsFoodSushiLegionSuperCooked]
  components:
  - type: Food
    transferAmount: 10
  - type: Sprite
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 55
        reagents:
        - ReagentId: Rice
          Quantity: 10
        - ReagentId: !type:CreateVariants
            values: [ N14UncookedAnimalProteinsRad, Protein,N14UncookedAnimalProteinsRad, Protein ]
          Quantity: !type:CreateVariants
            values: [3,2,6,4]
        - ReagentId: !type:CreateVariants
            values: [Fat, Nutriment, Fat, Nutriment]
          Quantity: !type:CreateVariants
            values: [2,2,4,4]
        - ReagentId: !type:CreateVariants
            values: [JuiceCarrot,JuiceCarrot,Empty,Empty]
          Quantity: !type:CreateVariants
            values: [20,20,1,1]
        - ReagentId: Cellulose
          Quantity: 10
        - ReagentId: Fiber
          Quantity: 10
  - type: GeneralConstructs
    generalEnts:
      SushiFried: !type:CreateVariants
        values: [MisfitsFoodSushiNCRSuperCooked,MisfitsFoodSushiNCRSuperCooked,MisfitsFoodSushiLegionSuperCooked,MisfitsFoodSushiLegionSuperCooked]
  - type: Construction
    graph: GraphSushi
    node: !type:CreateVariants
      values: [ start, SushiFried, start, SushiFried]
    defaultTarget: !type:CreateVariants
      values: [ SushiFried, start, SushiFried, start]

