          Quantity: !type:CreateVariants
            values: [2,5,5,2,6]
        - ReagentId: !type:CreateVariants
            values: [Empty,Empty, JuiceCarrot, JuiceCarrot, Hotsauce]
          Quantity: !type:CreateVariants
            values: [1,1,10,20,2]
