





- type: entity
  parent: BaseItem
  id: MisfitsFoodBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
    - food
  - type: Food
  - type: Sprite
  - type: StaticPrice
    price: 0

- type: entity
  parent: MisfitsFoodBase
  id: !type:CreateVariants
    values: [ MisfitsSushiMeatRaw, MisfitsSushiMeatCooked, MisfitsSushiFishRaw, MisfitsSushiFishCooked, MisfitsSushiFishCarrotRaw, MisfitsSushiFishCarrotCooked ,MisfitsSushiNCRRaw, MisfitsSushiNCRCooked, MisfitsSushiSpicyRaw, MisfitsSushiSpicyCooked]
  components:
  - type: Food
    transferAmount: 10
  - type: Sprite
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 35
        reagents:
        - ReagentId: Rice
          Quantity: 10
        - ReagentId: !type:CreateVariants
            values: [N14UncookedAnimalProteinsRad, Protein,N14UncookedAnimalProteinsRad, Protein,N14UncookedAnimalProteinsRad, Protein,N14UncookedAnimalProteinsRad, Protein,N14UncookedAnimalProteinsRad, Protein]
          Quantity: !type:CreateVariants
            values: [3,2,3,2,3,2,3,2,3,2,9,6]
        - ReagentId: !type:CreateVariants
            values: [ Fat, Nutriment,Vitamin, Vitamin,Vitamin, Vitamin,Fat, Nutriment,Fat, Nutriment,Fat, Nutriment]
          Quantity: !type:CreateVariants
            values: [2,2,5,5,5,5,2,2,6,6]
        - ReagentId: !type:CreateVariants
            values: [Empty,Empty,Empty,Empty, JuiceCarrot, JuiceCarrot, JuiceCarrot, JuiceCarrot, Hotsauce, Hotsauce]
          Quantity: !type:CreateVariants
            values: [1,1,1,1,10,10,10,10,2,2]







