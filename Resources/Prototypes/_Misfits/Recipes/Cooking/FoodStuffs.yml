# red fish cutlet
# _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
- type: entity
  parent: FoodMeatBase
  name: !type:CreateVariants
    values: [Red Fish Cutlet, Fried Red Fish Cutlet ]
  id: !type:CreateVariants
    values: [ N14RedfishCutletRaw,N14RedfishCutletCooked]
  description: food-desc-redFishCutlet
  components:
  - type: Food
    eatMessage: food-desc-redFishCutlet-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: !type:CreateVariants
      values: ["redFishCutlet", "redFishCutletCooked"]
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: !type:CreateVariants
            values: [ N14UncookedAnimalProteinsRad, Protein ]
          Quantity: !type:CreateVariants
            values: [2,2]
        - ReagentId: Vitamin
          Quantity: 2 # Red fish has vitamins even when raw
  - type: GeneralConstructs
    generalEnts:
      Cooked: !type:CreateVariants
        values: [ N14RedfishCutletCooked, N14RedfishCutletCooked]
  - type: Construction
    graph: GraphCookAny
    node: !type:CreateVariants
      values: [ start, CookNode]
    defaultTarget: !type:CreateVariants
      values: [ CookNode, start]
