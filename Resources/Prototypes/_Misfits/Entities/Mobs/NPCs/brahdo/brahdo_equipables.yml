  name: brahdo saddle basic
  description: a saddle that can let you strap packs and such onto a brahdo. Doesnt come with armor.
  components:
  - type: Sprite
    layers:
    - state: icon-saddle
    - state: icon-cloth
      color: '#2b2201'
  - type: Clothing
    sprite: _Misfits/Clothing/Animal/Brahdo/Armor/saddle.rsi
    inSlot: saddle
    clothingVisuals:
      outerClothing:
      - state: base
        color: '#2b2201'
    slots:
    - outerClothing


