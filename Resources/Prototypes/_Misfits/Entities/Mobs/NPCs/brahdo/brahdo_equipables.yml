- type: entity
  parent: ClothingOuterBase
  id: ClothingBrahdoSaddleBase
  name: brahdo saddle
  description: DEBUG DEBUG
  abstract: true
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Animal/Brahdo/Armor/saddleIcon.rsi
    layers:
    - state: icon-saddle
    - state: icon-cloth
  - type: Clothing
    sprite: _Misfits/Clothing/Animal/Brahdo/Armor/saddle.rsi
    inSlot: saddle
    clothingVisuals:
      outerClothing:
      - state: base
    slots:
    - outerClothing
  - type: Tag
    tags:
    - Brahdo
