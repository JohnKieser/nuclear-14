- type: utilityQuery
  id: NearbyMeleeTargets_Xray
  query:
  - !type:NearbyHostilesQuery
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetHealthCon
    curve: !type:PresetCurve
      preset: TargetHealth

- type: utilityQuery
  id: NearbyGunTargets_Xray
  query:
  - !type:NearbyHostilesQuery
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetHealthCon
    curve: !type:PresetCurve
      preset: TargetHealth
#  - !type:TargetAccessibleCon
#    curve: !type:BoolCurve


- type: htnCompound
  id: N14MaterialExtractorWaveCompound_ranged
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: N14RangedCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: N14MaterialExtractorWaveCompound_melee

- type: htnCompound
  id: N14MaterialExtractorWaveCompound_melee
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        targetKey: FollowTarget
        rangeKey: MeleeRange
        removeKeyOnFinish: false
  - tasks:
    - !type:HTNCompoundTask
      task: N14MeleeCombatCompound_Xray

- type: htnCompound
  id: N14MeleeCombatCompound_Xray
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargets_Xray
    - !type:HTNCompoundTask
      task: N14MeleeAttackTargetCompound_Xray

- type: htnCompound
  id: N14MeleeAttackTargetCompound_Xray
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:JukeOperator
        jukeType: AdjacentTile
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
      services:
      - !type:UtilityService
        id: MeleeService
        proto: NearbyMeleeTargets_Xray
        key: Target
