- type: utilityQuery
  id: NearbyMeleeTargets_Xray
  query:
  - !type:NearbyHostilesQuery
  considerations:
  - !type:TargetIsPriority
    target: PriorityTargetEntity
    curve: !type:ConstCurve
      constantSucceed: 0.3
      constantFail: 0.1
  - !type:TargetIsAliveCon
    curve: !type:ConstCurve
      constantSucceed: 1.0
      constantFail: 0.1
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistanceExpanded
#  - !type:TargetHealthCon
#    curve: !type:PresetCurve
#      preset: TargetHealth

- type: utilityQuery
  id: PriorityTargetService
  limit: 1
  query:
  - !type:ComponentQuery
    components:
    - type: PriorityTarget

- type: utilityQuery
  id: NearbyGunTargets_Xray
  query:
  - !type:NearbyHostilesQuery
  considerations:
  - !type:TargetIsPriority
    target: PriorityTargetEntity
    curve: !type:ConstCurve
      constantSucceed: 0.3
      constantFail: 0.1
  - !type:TargetIsAliveCon
    curve: !type:ConstCurve
      constantSucceed: 1.0
      constantFail: 0.1
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistanceExpanded
#  - !type:TargetHealthCon
#    curve: !type:PresetCurve
#      preset: TargetHealth


- type: htnCompound
  id: N14MaterialExtractorWaveCompound_ranged
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: N14RangedCombatCompound
    preconditions:
    - !type:CoordinatesInRangePrecondition
      targetKey: PriorityTarget
      rangeKey: PriorityTargetRangeMax
  - tasks:
    - !type:HTNCompoundTask
      task: N14MaterialExtractorWaveCompound_melee

- type: htnCompound
  id: N14MaterialExtractorWaveCompound_SeekPriorityTarget
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: PriorityTargetService
        keyCoordinates: PriorityTarget
        key: PriorityTargetEntity
    preconditions:
    - !type:KeyNotExistsPrecondition
      key: PriorityTarget
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        targetKey: PriorityTarget
        rangeKey: PriorityTargetReturnDist
        removeKeyOnFinish: false
    preconditions:
    - !type:KeyExistsPrecondition
      key: PriorityTarget
    - !type:CoordinatesNotInRangePrecondition
      targetKey: PriorityTarget
      rangeKey: PriorityTargetRangeMax

- type: htnCompound
  id: N14MaterialExtractorWaveCompound_melee
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: N14MaterialExtractorWaveCompound_SeekPriorityTarget
  - tasks:
    - !type:HTNCompoundTask
      task: N14MeleeCombatCompound_Xray
    preconditions:
    - !type:CoordinatesInRangePrecondition
      targetKey: PriorityTarget
      rangeKey: PriorityTargetRangeMax

- type: htnCompound
  id: N14MeleeCombatCompound_Xray
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargets_Xray
    - !type:HTNCompoundTask
      task: N14MeleeAttackTargetCompound_Xray

- type: htnCompound
  id: N14MeleeAttackTargetCompound_Xray
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:JukeOperator
        jukeType: AdjacentTile
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
      services:
      - !type:UtilityService
        id: MeleeService
        proto: NearbyMeleeTargets_Xray
        key: Target
